<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./ontime/">
  <title>ONTIME moved</title>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.filter(r => r.scope.includes('/codex/')).map(r => r.unregister()));
        }
      } catch {}
      location.replace('./ontime/');
    })();
  </script>
</head>
<body>
  <p>ONTIME 已搬到 <a href="./ontime/">/codex/ontime/</a></p>
</body>
</html>
